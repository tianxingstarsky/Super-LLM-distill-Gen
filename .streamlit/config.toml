# Streamlit 原生主题锁定为浅色工作台，与截图中的数据后台保持一致。
# 色值必须与 lib/console_theme.py 的 LIGHT_TOKENS 一致（tests/test_console_theme.py 校验）。
[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#1769E0"
backgroundColor = "#F1F5FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#152238"
