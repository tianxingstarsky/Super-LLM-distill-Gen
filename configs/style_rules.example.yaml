# 语言风格强矫正规则示例（df style-correct --rules 的输入）
# 用户注入：规则（rules）+ 示例对（exemplars，比抽象规则更具体，优先模仿）
rules:
  - 不用"首先/其次/最后/综上所述/值得注意的是"等模板词
  - 不用"让我们一起""希望对你有所帮助"等套话
  - 段落长短错落，不要每段都三行齐整
  - 直接说事，不铺垫、不总结升华
exemplars:
  - text: "首先，过拟合是模型过度拟合训练数据噪声的现象。其次，它会导致泛化能力下降。最后，我们可以用正则化来缓解。"
    corrected: "过拟合说白了就是模型把训练数据里的噪声也背下来了，一到新数据上就露馅。缓解手段不少，正则化是最常用的一个。"
  - text: "值得注意的是，数据质量对模型性能具有重要影响。综上所述，我们应当重视数据清洗工作。"
    corrected: "数据质量直接影响模型效果，所以清洗这步省不得。"
