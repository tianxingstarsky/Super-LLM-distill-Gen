<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:13px "Segoe UI","Microsoft YaHei",sans-serif;color:#244363;background:transparent}
.shell{border:1px solid #dce8f6;border-radius:12px;background:#f8fbff;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #e3edf8;background:#fff}
.toolbar button{background:#f6f9ff;border:1px solid #dce7f4;border-radius:6px;min-width:30px;height:28px;color:#326aaf;cursor:pointer}
.toolbar span{font-size:11px;color:#71869f;margin-left:auto}.toolbar{flex-wrap:wrap}.viewport{overflow:auto;position:relative;background:radial-gradient(#dce8f7 .7px,transparent .7px) 0 0/18px 18px;cursor:grab;overscroll-behavior:contain;touch-action:pan-x pan-y}
.viewport.drag{cursor:grabbing}.space{position:relative}.canvas{position:absolute;transform-origin:top left}.canvas svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.node{position:absolute;width:218px;height:78px;border:1px solid #cbdff5;border-radius:10px;background:#fff;box-shadow:0 3px 10px #41699610;display:flex;align-items:center;gap:10px;padding:11px;cursor:pointer;text-align:left;color:#244363}
.node:focus-visible{outline:3px solid #6cb2ff;outline-offset:3px}.node.selected{border:2px solid #247ae4;background:#f1f7ff;box-shadow:0 3px 14px #246dd325}
.node[data-status=completed]{border-color:#7bc9ac}.node[data-status=running]{border-color:#247ae4}.node[data-status=failed],.node[data-status=cancelled]{border-color:#df969d}
.node.selected{border:2px solid #247ae4}.node:hover{box-shadow:0 4px 16px #246dd330}.node[data-node=preference] .icon,.node[data-node=cot] .icon{background:#f0eaff;color:#8054c7}.node[data-node=multiturn] .icon,.node[data-node=agent] .icon{background:#e1f8f3;color:#138a78}.node[data-node=package] .icon{background:#e1f8ea;color:#13885d}.node[data-node=gsm8k] .icon{background:#fff4dd;color:#b77a17}.node.intermediate{border-style:dashed}.icon{width:32px;height:35px;background:#eaf3ff;border-radius:8px;display:grid;place-items:center;color:#287ad5;font-size:20px;flex-shrink:0}
.copy{min-width:0;flex:1}.copy strong{display:block;font-size:16px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy small{display:block;font-size:13px;color:#71869f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;right:9px;top:8px;width:6px;height:6px;border-radius:50%;background:#acb9ca}.node[data-status=completed] .dot{background:#1db181}.node[data-status=running] .dot{background:#247ae4}.node[data-status=failed] .dot{background:#d5626c}
.track{position:absolute;bottom:0;left:9px;right:9px;height:3px;background:#ecf2fa;border-radius:3px;overflow:hidden}.track i{display:block;height:100%;background:#2c89e8}.footer{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#fff;color:#71869f;font-size:10px}.legend{white-space:nowrap}.legend i{display:inline-block;width:6px;height:6px;background:#1db181;border-radius:50%;margin:0 4px 0 8px}.legend i:nth-child(2){background:#247ae4}
</style></head><body><div class="shell"><div class="toolbar"><button id="minus">−</button><button id="plus">+</button><button id="fit"></button><button id="reset">100%</button><button id="focus"></button><span id="hint"></span></div><div class="viewport" id="view"><div class="space" id="space"><div class="canvas" id="canvas"></div></div></div><div class="footer"><span id="lineage"></span><span id="overview"></span><span id="scale"></span></div><div class="footer legend" id="legend" hidden></div></div>
<script>
const post=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},"*");
const view=document.getElementById("view"), canvas=document.getElementById("canvas"), space=document.getElementById("space");
let spec,scale=1,signature="",serial=0,lastSelected="",lastFrameHeight=0,fitMode=true;
const text=(id,value)=>document.getElementById(id).textContent=value;
function resize(){if(!spec)return;canvas.style.transform=`scale(${scale})`;space.style.width=`${Math.max(view.clientWidth,spec.width*scale)}px`;canvas.style.left=`${Math.max(0,(view.clientWidth-spec.width*scale)/2)}px`;space.style.height=`${Math.max(view.clientHeight,spec.height*scale)}px`;canvas.style.top=`${Math.max(0,(view.clientHeight-spec.height*scale)/2)}px`;text("scale",Math.round(scale*100)+"%");document.getElementById("minus").disabled=scale<=.35;document.getElementById("plus").disabled=scale>=1.8;const height=document.querySelector(".shell").offsetHeight;if(height!==lastFrameHeight){lastFrameHeight=height;post("streamlit:setFrameHeight",{height})}}
function fit(){if(!spec)return;fitMode=true;scale=Math.max(.35,Math.min(1,(view.clientWidth-12)/spec.width,(view.clientHeight-12)/spec.height));resize()}
function zoom(value,x=view.clientWidth/2,y=view.clientHeight/2){if(!spec)return;const worldX=(view.scrollLeft+x-canvas.offsetLeft)/scale,worldY=(view.scrollTop+y-canvas.offsetTop)/scale;fitMode=false;scale=Math.max(.35,Math.min(1.8,value));resize();view.scrollLeft=worldX*scale+canvas.offsetLeft-x;view.scrollTop=worldY*scale+canvas.offsetTop-y}
function locate(){if(!spec)return;const n=spec.nodes.find(n=>n.id===spec.selected);if(n){view.scrollLeft=Math.max(0,n.x*scale+canvas.offsetLeft-(view.clientWidth-218*scale)/2);view.scrollTop=Math.max(0,n.y*scale+canvas.offsetTop-(view.clientHeight-78*scale)/2)}}
function moveFocus(n,key){const right=key==="ArrowRight",vertical=key==="ArrowUp"||key==="ArrowDown",sign=right||key==="ArrowDown"?1:-1;const candidates=spec.nodes.filter(other=>other.id!==n.id).map(other=>{const dx=other.x-n.x,dy=other.y-n.y;return{other,forward:(vertical?dy:dx)*sign,cross:Math.abs(vertical?dx:dy)}}).filter(item=>item.forward>1).sort((a,b)=>(a.forward+2*a.cross)-(b.forward+2*b.cross));const target=key==="Home"?spec.nodes[0]:key==="End"?spec.nodes[spec.nodes.length-1]:candidates[0]?.other;if(target){const button=[...canvas.querySelectorAll("button")].find(b=>b.dataset.node===target.id);button?.focus()}}
function render(next){const focusedNode=document.activeElement?.dataset?.node;spec=next;view.style.height=Math.min(560,Math.max(320,spec.height*.8))+"px";canvas.style.width=spec.width+"px";canvas.style.height=spec.height+"px";canvas.replaceChildren();
 const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("width",spec.width);svg.setAttribute("height",spec.height);canvas.append(svg);
 const byId=Object.fromEntries(spec.nodes.map(n=>[n.id,n]));
 for(const [a,b] of spec.edges){const from=byId[a],to=byId[b],x=from.x+218,y=from.y+39,ex=to.x,ey=to.y+39,path=document.createElementNS(ns,"path");const bypass=b==="package"&&ex-x>300,rail=from.y===Math.min(...spec.nodes.filter(n=>n.x===from.x).map(n=>n.y))?35:spec.height-22;path.setAttribute("d",bypass?`M ${x} ${y} C ${x+24} ${y},${x+24} ${rail},${x+42} ${rail} L ${ex-35} ${rail} C ${ex-18} ${rail},${ex-18} ${ey},${ex-7} ${ey}`:`M ${x} ${y} C ${x+30} ${y},${ex-30} ${ey},${ex-7} ${ey}`);path.dataset.from=a;path.dataset.to=b;path.setAttribute("fill","none");path.setAttribute("stroke",to.status==="running"?"#3087e7":from.status==="completed"&&to.status==="completed"?"#45b89a":"#a6bdd9");path.setAttribute("stroke-width","2");svg.append(path);const arrow=document.createElementNS(ns,"path");arrow.setAttribute("d",`M ${ex-8} ${ey-4} L ${ex-1} ${ey} L ${ex-8} ${ey+4}`);arrow.setAttribute("fill","none");arrow.setAttribute("stroke",path.getAttribute("stroke"));svg.append(arrow)}
 for(const n of spec.nodes){const button=document.createElement("button");button.className="node"+(n.id===spec.selected?" selected":"")+(n.intermediate?" intermediate":"");button.dataset.status=n.status;button.dataset.node=n.id;button.style.left=n.x+"px";button.style.top=n.y+"px";button.setAttribute("aria-label",n.label+" · "+n.subtitle);button.setAttribute("aria-pressed",n.id===spec.selected);button.title=n.label+" · "+n.subtitle;
 const icon=document.createElement("span"),copy=document.createElement("span"),title=document.createElement("strong"),sub=document.createElement("small"),dot=document.createElement("i");icon.className="icon";icon.textContent=n.glyph;copy.className="copy";title.textContent=n.label;sub.textContent=n.subtitle;copy.append(title,sub);dot.className="dot";button.append(icon,copy,dot);
 if(spec.live){const track=document.createElement("span"),fill=document.createElement("i");track.className="track";fill.style.width=n.percent+"%";track.append(fill);button.append(track)}
 button.onclick=()=>{post("streamlit:setComponentValue",{dataType:"json",value:{node:n.id,serial:Date.now()+"-"+(++serial)}})};button.onkeydown=e=>{if(["ArrowRight","ArrowDown","ArrowLeft","ArrowUp","Home","End"].includes(e.key)){e.preventDefault();moveFocus(n,e.key)}};canvas.append(button);if(n.id===focusedNode)button.focus({preventScroll:true})}
 text("fit",spec.labels.fit);text("focus",spec.labels.focus);text("hint",spec.labels.hint);text("lineage",spec.labels.lineage);text("overview",spec.labels.overview);document.getElementById("reset").setAttribute("aria-label",spec.labels.reset);document.getElementById("plus").setAttribute("aria-label",spec.labels.zoom_in);document.getElementById("minus").setAttribute("aria-label",spec.labels.zoom_out);
 const legend=document.getElementById("legend");legend.hidden=!spec.live;legend.replaceChildren();if(spec.live){for(const [key,color] of [["completed","#1db181"],["running","#247ae4"],["failed","#d5626c"]]){const item=document.createElement("span"),dot=document.createElement("i");dot.style.background=color;item.append(dot,document.createTextNode(spec.labels[key]));legend.append(item)}}
 const nextSignature=spec.nodes.map(n=>n.id).join();if(nextSignature!==signature){signature=nextSignature;fit();locate()}else if(fitMode)fit();else resize();if(lastSelected!==spec.selected){lastSelected=spec.selected;locate()}}
document.getElementById("plus").onclick=()=>zoom(scale+.1);document.getElementById("minus").onclick=()=>zoom(scale-.1);document.getElementById("fit").onclick=()=>{fit();locate()};document.getElementById("reset").onclick=()=>zoom(1);document.getElementById("focus").onclick=locate;
view.addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const rect=view.getBoundingClientRect();zoom(scale*Math.exp(-e.deltaY*.002),e.clientX-rect.left,e.clientY-rect.top)}},{passive:false});
let drag;view.onpointerdown=e=>{if(e.target.closest("button")||e.button!==0)return;drag={x:e.clientX,y:e.clientY,left:view.scrollLeft,top:view.scrollTop};view.classList.add("drag");view.setPointerCapture(e.pointerId)};view.onpointermove=e=>{if(drag){view.scrollLeft=drag.left+drag.x-e.clientX;view.scrollTop=drag.top+drag.y-e.clientY}};const endDrag=()=>{drag=null;view.classList.remove("drag")};view.onpointerup=endDrag;view.onpointercancel=endDrag;view.onlostpointercapture=endDrag;
window.addEventListener("message",event=>{if(event.source===parent&&event.data.type==="streamlit:render")render(event.data.args.spec)});new ResizeObserver(()=>{if(spec){if(fitMode){fit();locate()}else resize()}}).observe(view);post("streamlit:componentReady",{apiVersion:1});
</script></body></html>
