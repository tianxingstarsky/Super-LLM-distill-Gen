<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <section id="stream-panel" class="stream-panel" aria-label="节点模型输出">
    <header class="stream-header">
      <div class="stream-heading"><span id="activity-dot" class="activity-dot" aria-hidden="true"></span><strong id="stream-title"></strong><span id="stream-status" class="stream-status" role="status" aria-live="polite"></span></div>
      <button id="follow-request" class="quiet-button" type="button" hidden></button>
    </header>
    <div id="request-tabs" class="request-tabs" role="tablist" hidden></div>
    <div id="stream-meta" class="stream-meta"></div>
    <div id="output-reader" class="output-reader" tabindex="0" role="region">
      <details id="reasoning-section" class="reasoning-section" hidden>
        <summary id="reasoning-label"></summary>
        <div id="reasoning-output" class="response-text reasoning-text"></div>
      </details>
      <div id="answer-section" class="answer-section" hidden>
        <div id="answer-label" class="answer-label"></div>
        <div class="answer-body"><span id="answer-output" class="response-text"></span><span id="stream-cursor" class="stream-cursor" aria-hidden="true" hidden></span></div>
      </div>
      <p id="stream-empty" class="stream-empty"></p>
    </div>
    <footer class="stream-footer">
      <span id="stream-note"></span>
      <button id="follow-bottom" class="quiet-button" type="button" hidden></button>
    </footer>
  </section>
</body>
</html>
