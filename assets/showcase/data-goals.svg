    <g id="layers" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 12 45 21 28 30 11 21 Z M12 28 28 37 44 28 M12 35 28 44 44 35"/></g>
    <g id="feedback" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 16 H34 V35 H23 L16 40 V35 H13 Z M36 15 38 21 44 23 38 25 36 31 34 25 28 23 34 21 Z M19 23 H23 M19 28 H27"/></g>
