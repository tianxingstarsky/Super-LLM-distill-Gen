<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nine ways to shape useful data.</title>
  <desc id="desc">ShuJian Cube supports CPT domain reading material, SFT instructions and answers, DPO preferred answer pairs, ORPO preference pairs, RLAIF AI feedback candidates, agent conversations with verified tools, multi-turn role-based conversations, visible CoT reasoning examples, and GSM8K-style basic arithmetic examples. Choose one goal or combine several in the workbench.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c9aff"/><stop offset="1" stop-color="#3272dc"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31c4d4"/><stop offset="1" stop-color="#2299ba"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a38bea"/><stop offset="1" stop-color="#7e69ca"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#2356a8" flood-opacity=".06"/></filter>
    <g id="book" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15 Q20 11 28 15 Q36 11 44 15 V39 Q36 35 28 39 Q20 35 12 39 Z M28 15 V39 M17 20 H23 M17 25 H23 M33 20 H39 M33 25 H39"/></g>
