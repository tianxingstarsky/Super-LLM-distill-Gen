    <g id="reasoning" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 19 V28 M28 28 H16 V36 M28 28 H40 V36"/><circle cx="28" cy="14" r="5"/><rect x="10" y="36" width="12" height="9" rx="3"/><rect x="34" y="36" width="12" height="9" rx="3"/></g>
